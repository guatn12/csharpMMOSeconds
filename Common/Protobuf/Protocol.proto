syntax = "proto3";
package Protocol;

import "google/protobuf/descriptor.proto"; // descriptor를 사용하기 위해 import

enum PacketCategory {
	NONE_CATEGORY = 0;			// 카테고리 없음 - 미사용 오류 분별용
	SYSTEM = 1;					// 시스템 레벨 (입장/퇴장)
	ROOM = 2;					// Room 레벨
	COMBAT = 3;					// 전투 관련
	INVENTORY = 4;				// 인벤토리 관련
}

extend google.protobuf.MessageOptions {
	PacketCategory category = 500002;
}

enum MsgId {
	C_ENTER_GAME = 0;		// 게임 입장 요청 (클라이언트 → 서버)
	S_ENTER_GAME = 1;
	S_LEAVE_GAME = 2;
	S_SPAWN = 3;
	S_DESPAWN = 4;
	C_MOVE = 5;
	S_MOVE = 6;
	C_CHAT = 7;
	S_CHAT = 8;
	S_PLAYER_UPDATE = 9;	// 플레이어 상태 변경 알림
	S_PLAYER_STAT = 10;		// 플레이어 스탯 정보
	C_PLAYER_INFO = 11;		// 플레이어 정보 요청
	C_USE_SKILL = 12;		// 플레이어 스킬 사용
	S_DAMAGE = 13;			// 데미지 처리
	S_HEAL = 14;			// 회복 처리
	S_LEVEL_UP = 15;		// 레벨업 알림

	// 인벤토리
	C_INVENTORY_REQUEST = 16;	// 인벤토리 조회 요청
	S_INVENTORY_DATA = 17;		// 인벤토리 데이터 전송
	C_USE_ITEM = 18;			// 아이템 사용
	S_USE_ITEM = 19;			// 아이템 사용 결과
	C_EQUIPMENT_REQUEST = 37;	// 장비 조회 요청
	S_EQUIPMENT_DATA = 38;		// 장비 데이터 전송
	C_EQUIP_ITEM = 20;			// 아이템(장비) 장착
	S_EQUIPMENT_UPDATE = 21;	// 아이템(장비) 업데이트
	C_UNEQUIP_ITEM = 22;		// 아이템(장비) 해제
	reserved 23, 24;			// 기존 번호 재활용 안함.
	S_INVENTORY_UPDATE = 25;	// 인벤토리 변경 알림

	// 몬스터
	S_MONSTER_DIE = 26;			// 몬스터 사망 알림
	S_MONSTER_UPDATE = 27;		// 몬스터 상태 업데이트

	// ROOM 변경
	C_CHANGE_ROOM = 28;			// 룸 변경 요청, 클라 -> 서버
	S_CHANGE_ROOM = 29;			// 룸 변경 결과, 서버 -> 클라

	// 이동
	C_AUTO_MOVE = 30;			// 자동 이동 목적지 요청
	S_PATH_INFO = 31;			// 서버가 계산한 경로 반환

	C_LOGIN = 32;				// 로그인 요청 (클라이언트 -> 서버)
	S_LOGIN = 33;				// 로그인 결과 (서버 -> 클라이언트)
	S_FORCE_KICK = 34;			// 서버가 강제 퇴장 시킴 (서버 → 클라이언트)

	C_CREATE_PLAYER = 35;		// 캐릭터 생성 요청 (클라이언트 → 서버)
	S_CREATE_PLAYER = 36;		// 캐릭터 생성 결과 (서버 → 클라이언트)

	// 핑퐁
	C_PING = 10000;				// 클라이언트 → 서버
	S_PONG = 10001;				// 서버 → 클라이언트
}

message C_Login {
	option (category) = SYSTEM;
	string token = 1;
}

message S_Login {
	option (category) = SYSTEM;
	bool success = 1;
	string message = 2;
	int64 accountId = 3;						// 계정 ID
	repeated PlayerInfo players = 4;			// 보유 캐릭터 목록 (신규는 빈 리스트)
}

message C_EnterGame {
	option (category) = SYSTEM;
	int64 playerId = 1;		// 입장할 캐릭터 ID
}

// 서버 -> 클라이언트
// 게임 입장
message S_EnterGame {
	option (category) = SYSTEM;
	ObjectInfo player = 1;
	int32 mapId = 2;			// 입장한 맵 ID
}

// 서버 -> 클라이언트
// 플레이어가 게임을 떠났을 때,
message S_LeaveGame {
	option (category) = SYSTEM;
	int64 objectId = 1;
}

message C_ChangeRoom {
	option (category) = SYSTEM;
	int32 roomType = 1;			// roomType enum
	int32 targetId = 2;			// 세부 식별자 (MapID, 던전ID 등)
}

message S_ChangeRoom {
	option (category) = SYSTEM;
	bool success = 1;
	string failReason = 2;		// 실패 시 사유	
	ObjectInfo player = 3;		// 성공 시 업데이트된 플레이어 정보
	int32 mapId = 4;			// 성공 시 입장한 맵 ID
}

// 서버 -> 클라이언트
// 새로운 플레이어, 몬스터 등이 시야에 나왔을 때.
message S_Spawn {
	option (category) = ROOM;
	repeated ObjectInfo objects = 1;
}

// 서버 -> 클라이언트
// 플레이어 / 몬스터 등이 시야에서 사라졌을 때.
message S_Despawn {
	option (category) = ROOM;
	repeated ObjectInfo objects = 1;
}

// 클라이언트 -> 서버
// 이동 했을 때 주기적으로 전송.
message C_Move {
	option (category) = ROOM;
	PosInfo posInfo = 1;
}

// 서버 -> 클라이언트
// 다른 플레이어 / 몬스터가 이동했을 때 브로드 캐스팅.
message S_Move {
	option (category) = ROOM;
	repeated ObjectInfo objects = 1;
}

// 클라이언트 -> 서버
// 클라이언트가 채팅 전송.
message C_Chat {
	option (category) = ROOM;
	string message = 1;
}

message S_Chat {
	option (category) = ROOM;
	int64 playerId = 1;
	string message = 2;
}

message S_PlayerUpdate {
	option (category) = ROOM;
	ObjectInfo player = 1;
}

message S_PlayerStat {
	option (category) = ROOM;
	ObjectInfo player = 1;
}

message C_PlayerInfo {
	option (category) = ROOM;
	int64 targetPlayerId = 1;	// 조회할 플레이어 ID (0이면 자신)
}

message C_UseSkill {
	option (category) = COMBAT;
	int32 skillId = 1;
	int64 targetId = 2;	// 타겟 Id (0이면 자기 자신)
}

message S_Damage {
	option (category) = COMBAT;
	ObjectDamageInfo attacker = 1;
	repeated ObjectDamageInfo targets = 2;
}

message S_Heal {
	option (category) = COMBAT;
	ObjectDamageInfo healer = 1;
	repeated ObjectDamageInfo targets = 2;
}

message S_LevelUp {
	option (category) = ROOM;
	int64 playerId = 1;
	int32 newLevel = 2;
	int32 newMaxHP = 3;
	int32 newMaxMP = 4;
}

message C_InventoryRequest {
	option (category) = INVENTORY;
}

message S_InventoryData {
	option (category) = INVENTORY;
	repeated InventoryItemInfo items = 1;
	int64 gold = 2;
	int32 maxSlots = 3;
}

message C_EquipmentRequest {
	option (category) = INVENTORY;
}

message S_EquipmentData {
	option (category) = INVENTORY;
	repeated EquipmentSlotRef slots = 1;			// 장착한 장비 리스트
}

message C_UseItem {
	option (category) = INVENTORY;
	int64 instanceId = 1;				// 인벤 고유 번호
	int32 quantity = 2;					// 사용할 수량 (기본 1)
}

message S_UseItem {
	option (category) = INVENTORY;
	bool success = 1;
	string message = 2;
}

message C_EquipItem {
	option (category) = INVENTORY;
	int64 instanceId = 1;			// 인벤 고유 번호
	int32 equipSlot = 2;			// 장착 슬롯 (0 = 무기, 1 = 갑옷)
}

message C_UnequipItem {
	option (category) = INVENTORY;
	int32 equipSlot = 1;		// 해제할 장착 슬롯
}

message S_InventoryUpdate {
	option (category) = INVENTORY;
	repeated InventoryItemInfo changedItems = 1;
	optional int64 newGold = 2;
	repeated int64 removedItemInstanceIds = 3;
}

message S_EquipmentUpdate {
	option (category) = INVENTORY;
	bool success = 1;								// 성공 여부
	string reason = 2;								// 실패 시 이유
	repeated EquipmentSlotRef slots = 3;			// 성공 시 변경 완료 후의 장비 전체 상태
	StatInfo updatedStats = 4;						// 성공 시 최종 스탯
}

// 몬스터
message S_MonsterDie {
	option (category) = COMBAT;
	int64 monsterId = 1;
	int64 killPlayerId = 2;
	int64 expGained = 3;
	int64 goldGained = 4;
	repeated InventoryItemInfo droppedItems = 5;
}

// 몬스터 상태 변경(state, hp 등)
message S_MonsterUpdate {
	option (category) = ROOM;
	repeated ObjectInfo monsters = 1;
}

message C_AutoMove {
	option (category) = ROOM;
	PosInfo destination = 1;		// 목적지 월드 좌표
}

message S_PathInfo {
	option (category) = ROOM;
	repeated PosInfo waypoints = 1;		// 이동할 웨이포인트 순서 목록
	bool reachable = 2;					// 목적지 완전 도달 가능 여부
}

message S_ForceKick {
	option (category) = SYSTEM;
	string reason = 1;
}

message C_CreatePlayer {
	option (category) = SYSTEM;
	string PlayerName = 1;
}

message S_CreatePlayer {
	option (category) = SYSTEM;
	bool success = 1;
	string fail_reason = 2;				// 실패 사유 - 이미 사용중인 이름 / 금지어 / 길이 제한 등
	PlayerInfo player = 3;			// 성공 시 생성된 캐릭터 정보
}

// 핑퐁
message C_Ping {
	option (category) = SYSTEM;
	int64 timestamp = 1;		// 클라이언트에서 보낸 시간
}

message S_Pong {
	option (category) = SYSTEM;
	int64 timestamp = 1;		// 서버에서 보낸 시간
}


// --------- 공용 데이터 구조 --------- 

enum RoomType
{
	Lobby = 0;		// 로비 룸
	Battle = 1;		// 전투 룸
	Dungeon = 2;	// 던전 룸
	Guild = 3;		// 길드 룸
	Private	= 4;	// 개인 룸
}

enum ObjectType {
	OBJECT_NONE = 0;
	OBJECT_PLAYER = 1;
	OBJECT_MONSTER = 2;
	OBJECT_NPC = 3;
}

message ObjectInfo {
	int64 objectId = 1;
	ObjectType type = 2;
	string name = 3;
	PosInfo posInfo = 4;
	StatInfo statInfo = 5;
	State state = 6;
	// 2개의 정보 중 1개만 사용된다. - playerInfo에 데이터가 있으면 monsterInfo는 null처리된다.
	oneof info {
		PlayerDetailInfo playerDetailInfo = 7;
		MonsterDetailInfo monsterDetailInfo = 8;
	}
}

message PlayerInfo {
	int64 playerId = 1;				// 캐릭터 ID
	string playerName = 2;
	int32 level = 3;
	int64 createdAt = 4;			// Unix timestamp
}

// 데미지 처리 임시. 다시 수정 필요.
message ObjectDamageInfo {
	ObjectType type = 1;
	int64 objectId = 2;
	int32 damage = 3;
	int32 currentHP = 4;
	bool isCritical = 5;
}

message StatInfo {
	int32 attack = 1;			// 기본 공격력
	int32 defense = 2;			// 기본 방어력
	int32 maxHP = 3;			// 최대 HP
	int32 maxMP = 4;			// 최대 MP
	int32 currentHP = 5;		// 현재 HP
	int32 currentMP = 6;		// 현재 MP
	int64 experience = 7;		// 경험치
	int32 level = 8;			// 레벨
	float speed = 9;			// 이동 속도
}

message PosInfo {
	float posX = 1;			// x축
	float posY = 2;			// y축
	float posZ = 3;			// z축
	float rotationX = 4;	// x축 회전 (pitch) - 위/아래
	float rotationY = 5;	// y축 회전 (yaw) - 좌/우
	float rotationZ = 6;	// z축 회전 (roll) - 기울기
	int64 timestamp = 7;	// 위치 업데이트 시간 (성능용)
}

enum State {
	IDLE = 0;					// 대기
	PATROL = 1;					// 탐색
	RETURN = 2;					// 귀환
	WALKING = 3;				// 걷기
	RUNNING = 4;				// 달리기
	JUMPING = 5;				// 점프
	CHASE = 6;					// 추적
	FLYING = 7;					// 날기
	FALLING = 8;				// 추락
	IN_COMBAT = 9;				// 전투
	DEAD = 10;					// 사망
}

message PlayerDetailInfo {
	bool isGameMaster = 1;
}

message InventoryItemInfo{
	int64 instanceId = 1;
	int32 itemId = 2;
	int32 quantity = 3;
	int32 slot = 4;
	int32 enhancementLevel = 5;
	map<string, double> options = 6;
	string customName = 7;
	int64 acquiredAt = 8;				// Unix timestamp
}

message EquipmentSlotRef {
	int32 equipSlot = 1;
	int64 instanceId = 2;
}

message MonsterDetailInfo {
	int32 templatedId = 1;
}
