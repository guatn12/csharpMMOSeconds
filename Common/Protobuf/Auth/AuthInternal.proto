syntax = "proto3";

option csharp_namespace = "AuthContracts";

package auth.internal;

service AuthInternal {
  rpc RedeemLoginTicket (RedeemLoginTicketRequest)
      returns (RedeemLoginTicketReply);
}

message RedeemLoginTicketRequest {
  string login_ticket = 1;
}

message RedeemLoginTicketReply {
  bool active = 1;
  int64 account_id = 2;
}